name: "Supercomputadora LeadBot 24/7"

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-leadbot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python en la Nube
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🇪🇸 Ejecutar Motor Internacional (Inmobiliarias España - PayPal USD)
        run: |
          python scraper.py

      - name: 🇦🇷 Ejecutar Motor Nacional (Gastronomía Argentina - Mercado Pago)
        run: |
          python scraper_argentina.py

      - name: 💾 Guardar y Actualizar Bases de Datos en el Repositorio
        run: |
          git config --global user.name "Supercloud-LeadBot"
          git config --global user.email "bot@supercloud.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizacion automatica 24/7 [$(date -u +'%Y-%m-%d %H:%M')]" && git push)

      - name: 📦 Generar Paquete Descargable
        uses: actions/upload-artifact@v4
        with:
          name: paquete-monetizacion-completo
          path: |
            leads_inmobiliarias_espana.csv
            ofertas_y_demandas.md
            leads_gastronomia_argentina.csv
            propuestas_whatsapp_argentina.md
          if-no-files-found: ignore
