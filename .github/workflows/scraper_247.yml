name: Supercomputadora LeadBot 24/7

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-leadbot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python en la Nube
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Ejecutar Robot Extractor y Generador de Ofertas
        run: |
          python scraper.py

      - name: 💾 Guardar y Actualizar Leads y Ofertas en el Repositorio
        run: |
          git config --global user.name "Supercloud-LeadBot"
          git config --global user.email "bot@supercloud.local"
          git add leads_inmobiliarias_espana.csv ofertas_y_demandas.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizacion automatica 24/7 de leads y ofertas [$(date -u +'%Y-%m-%d %H:%M')]" && git push)

      - name: 📦 Generar Archivos Descargables (Artefactos)
        uses: actions/upload-artifact@v4
        with:
          name: paquete-leads-y-ofertas
          path: |
            leads_inmobiliarias_espana.csv
            ofertas_y_demandas.md
